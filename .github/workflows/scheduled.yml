name: Scheduled

# Weekly self-hosted Renovate. Every other repo in the fleet carries this file;
# backstage never did, so renovate.json was configured but nothing ran it and
# no dependency or workflow-pin update PR was ever opened here.
#
# The cron is not derived from an old GitLab schedule like the rest of the
# fleet's (this repo never had one). It is just unused by the others:
# Wednesday 05:31 UTC.
#
# Branch cleanup prunes stale renovate/* and bump/* branches (older than 30
# days, never an open PR's head, never protected), as in the rest of the fleet.

on:
  schedule:
    - cron: '31 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@39f04ec459e78dd5945c134af14b52ead0743ab5  # renovate-v1.1.1
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@adea087c43d56fd13d5b1abf2d5f2ba3e695784d  # branch-cleanup-v1.0.0
    with:
      age_days: 30
      dry_run: false
