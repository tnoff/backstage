name: Release

# Default-branch pipeline: fold the changelog, tag, and push the image.
#
# ---------------------------------------------------------------------------
# The fold guard
# ---------------------------------------------------------------------------
# assemble-changelog pushes a "docs: assemble changelog for X" commit to main,
# which triggers this workflow a SECOND time. That second pass is what cuts the
# tag, because tag defers while fragments are still pending.
#
# The image must NOT be pushed twice. The deleted .gitlab-ci.yml carried the
# same guard as .not-on-changelog-fold, and its reasoning holds unchanged: the
# fold commit is byte-identical in the image context, so a second push would
# skip the tag write on a shared digest and leave anything pinning that tag
# referencing something never written.
#
# This repo is the fleet's heaviest build, so a wasted rebuild is not a
# rounding error -- it is the single most expensive thing CI can do here.
#
# ---------------------------------------------------------------------------
# trigger-bump
# ---------------------------------------------------------------------------
# Asks docker-apps to rewrite its pin to the image this run just pushed. It was
# deliberately absent until now: docker-apps had no backstage/ tree, and its
# receiver ERRORS on an unknown source rather than ignoring it, so wiring this
# early would have turned every release red.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Skip the image build when the commit did not touch anything the image is
  # built from. Without this a metadata-only merge -- a catalog descriptor, a
  # README -- folds a changelog, cuts a tag, rebuilds the image and bumps a
  # production pin in docker-apps for content no image contains.
  #
  # The same filter already exists in ci.yml as the `changes` job, and it works:
  # the build correctly skips on a docs-only PR. It was never wired into the
  # release path, so the saving stopped at the PR and the merge rebuilt anyway.
  # That is the shape worth remembering -- a control present where you watch the
  # checks and absent where the work actually happens.
  #
  # The keep-list below is copied from ci.yml's `changes` job and must stay
  # identical to it. If the two drift, a PR can build an image that its own merge
  # then refuses to rebuild.
  #
  # Two differences from ci.yml's copy, both forced by the event: the base is
  # github.event.before compared two-dot rather than a PR base ref, and this one
  # FAILS OPEN. An absent, all-zeros or unreachable base builds anyway. A build
  # that did not need to happen costs minutes; a build that silently did not
  # happen leaves docker-apps pinned to a stale image and reads exactly like a
  # successful run.
  changes:
    name: Detect image-input changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO}" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable base ref (${BEFORE:-empty}) -- building"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "${BEFORE}" "${AFTER}")"
          MATCH=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              # .dockerignore is listed alongside the Dockerfile deliberately.
              # The two are one unit: the .dockerignore create-app ships is
              # written for the host-build Dockerfile it also ships, and
              # excludes plugins/ and packages/*/src -- fatal for this
              # multi-stage build, which compiles in-image. Replacing one means
              # replacing the other, so a change to either must rebuild.
              Dockerfile|.dockerignore) MATCH=true; break ;;
              package.json|yarn.lock|.yarnrc.yml|tsconfig.json) MATCH=true; break ;;
              app-config*.yaml) MATCH=true; break ;;
              # `*` matches `/` in a case pattern, so these cover nested paths.
              packages/*|plugins/*|.yarn/*) MATCH=true; break ;;
            esac
          done <<< "${FILES}"
          echo "changed files:"
          printf '%s\n' "${FILES}" | sed -n 's/^/  /p'
          echo "image inputs changed: ${MATCH}"
          echo "image=${MATCH}" >> "$GITHUB_OUTPUT"

  assemble-changelog:
    name: Assemble changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/assemble-changelog.yml@b5f1653b3f3a9750af00c7bfda9af04fe263c1b1
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  tag:
    name: Tag
    needs: assemble-changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/tag.yml@b5f1653b3f3a9750af00c7bfda9af04fe263c1b1
    with:
      gate_on_fragments: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  push-image:
    name: Push image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@b5f1653b3f3a9750af00c7bfda9af04fe263c1b1
    # registry / namespace / repo_name are INPUTS, not secrets. GitHub refuses
    # to set a job output containing secret material, so as secrets the `image`
    # output comes back EMPTY. See github-workflows!98.
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME }}
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  trigger-bump:
    name: Trigger docker-apps bump
    needs: push-image
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@b5f1653b3f3a9750af00c7bfda9af04fe263c1b1
    with:
      # Matches the `backstage)` branch in docker-apps' bump-image-pin.yml,
      # which resolves the image name and the file to rewrite from this key.
      bump_source: backstage
      image: ${{ needs.push-image.outputs.image }}
      # The IMMUTABLE per-commit tag, not primary_tag (`latest`). Pinning a
      # moving tag would leave the Deployment's manifest unchanged across
      # releases, so Flux would see no diff and nothing would ever roll.
      image_tag: ${{ needs.push-image.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
