# The standard descriptor name, at the repo root, exactly where Backstage's own
# discovery expects it -- and the same file Phase 2 adds to personal-website and
# eastbay. One convention, not a bespoke one for this repo.
#
# It carries three entities. That is deliberate: a location may hold multiple
# documents, and for a single-operator fleet the portal's own Component and the
# two org entities are one unit of "who owns what here". Split them when there
# is a second team to split them between.
#
# Shipped in the image (see the Dockerfile COPY) and loaded as a file location
# by app-config.production.yaml. No GitHub integration is configured -- that
# would be another secret for a portal reachable only over a bastion
# port-forward -- so a url: location is not available yet.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage
  description: The developer portal itself. Catalog only, for now.
  annotations:
    # github, not gitlab: this repo flipped to GitHub-canonical in the CI
    # migration. The project spec still says gitlab.com/project-slug from
    # before that, and this is the corrected form Phase 2 should copy.
    github.com/project-slug: tnoff/backstage
    # No backstage.io/techdocs-ref: the techdocs backend is not installed, so
    # the annotation would advertise a Docs tab that cannot render.
spec:
  type: website
  # Was `john@example.com` from create-app. Now a real group -- see below.
  owner: group:default/admin
  lifecycle: production
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: admin
  description: >-
    Fleet administrators. The owner of record for everything in this catalog
    until there is a reason to split ownership more finely.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: tnoff
  description: Fleet operator.
spec:
  # No spec.profile.email on purpose: this repo is PUBLIC, and nothing needs
  # the address yet. Sign-in resolvers can match on the entity name, and an
  # email only becomes necessary if a provider is configured to resolve by it.
  memberOf: [admin]
