# The standard descriptor name, at the repo root, exactly where Backstage's own
# discovery expects it -- and the same file Phase 2 adds to personal-website and
# eastbay. One convention, not a bespoke one for this repo.
#
# It carries two entities: this repo's Component, and the Group that owns it. A
# location may hold multiple documents, and for a single-operator fleet the
# portal's own Component and its owner are one unit of "who owns what here".
# Split them when there is a second team to split them between.
#
# There is deliberately NO User entity. A User is an identity to sign IN as, and
# nothing signs in -- the frontend installs no SignInPage, so the app renders
# anonymously (see packages/backend/src/index.ts). A User with no sign-in path
# is a row that never resolves to anybody. Ownership does not need one: `owner`
# points at the Group, and a Group is valid with no members at all (the schema
# requires spec.type and spec.children; spec.members is optional). Add the User
# back in the same change that adds a sign-in provider, when its name finally
# has something to match against.
#
# Read by the GitHub discovery provider straight from this repo, exactly like
# every other repo's descriptor -- not copied into the image and not named in a
# `locations:` block. Both mechanisms at once would emit these entityRefs twice
# and the catalog rejects the duplicate.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage
  description: The developer portal itself. Catalog only, for now.
  # No annotations, and github.com/project-slug in particular is DERIVED rather
  # than written here. The catalog registers AnnotateScmSlugEntityProcessor (see
  # packages/backend/src/modules/scmSlugAnnotator.ts), which reads the slug off
  # the location this file was fetched from -- so it cannot go stale, and it
  # picks the right annotation name if the repo ever changes host. The hardcoded
  # `gitlab.com/project-slug` left in the project spec after the GitHub
  # migration is the failure that motivated this.
  #
  # No backstage.io/techdocs-ref either: the techdocs backend is not installed,
  # so the annotation would advertise a Docs tab that cannot render.
spec:
  type: website
  # The portal's only stateful dependency. POSTGRES_HOST on the Deployment is
  # backstage-pg.backstage-postgres.svc.cluster.local, so this edge is read off
  # the running pod rather than inferred from the manifests.
  dependsOn:
    - resource:default/backstage-postgres
  # Was `john@example.com` from create-app. A Group rather than a User so the
  # field keeps meaning if a second person ever appears -- and so it does not
  # depend on an identity provider that does not exist.
  owner: group:default/admin
  lifecycle: production
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: admin
  description: >-
    Fleet administrators. The owner of record for everything in this catalog
    until there is a reason to split ownership more finely.
spec:
  type: team
  # Required by the Group schema even when empty. Empty is correct: `children`
  # holds nested GROUPS, not members, and there are no sub-groups.
  children: []
---
# Declared here rather than in docker-apps, where postgresql/backstage/ applies its
# manifests. A datastore sits with the system it serves -- the same rule that puts
# discord-postgres and redis in discord-bot's descriptor. The monitoring stack is the
# exception, and for a different reason: those components have no other repo to be
# described from at all.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: backstage-postgres
  description: >-
    The operator-managed `backstage-pg` cluster in the `backstage-postgres` namespace,
    reached as the `backstage.backstage` role. Backed up nightly by the
    backstage-database-backup CronJob. Holds one schema per plugin rather than one database
    per plugin -- `pluginDivisionMode: schema`, which is why it is a single cluster and not
    thirteen.
spec:
  type: database
  owner: group:default/admin
