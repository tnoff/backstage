# The standard descriptor name, at the repo root, exactly where Backstage's own
# discovery expects it -- and the same file Phase 2 adds to personal-website and
# eastbay. One convention, not a bespoke one for this repo.
#
# It carries two entities: this repo's Component, and the Group that owns it. A
# location may hold multiple documents, and for a single-operator fleet the
# portal's own Component and its owner are one unit of "who owns what here".
# Split them when there is a second team to split them between.
#
# There is deliberately NO User entity. A User is an identity to sign IN as, and
# nothing signs in -- the frontend installs no SignInPage, so the app renders
# anonymously (see packages/backend/src/index.ts). A User with no sign-in path
# is a row that never resolves to anybody. Ownership does not need one: `owner`
# points at the Group, and a Group is valid with no members at all (the schema
# requires spec.type and spec.children; spec.members is optional). Add the User
# back in the same change that adds a sign-in provider, when its name finally
# has something to match against.
#
# Shipped in the image (see the Dockerfile COPY) and loaded as a file location
# by app-config.production.yaml.
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage
  description: The developer portal itself. Catalog only, for now.
  annotations:
    # github, not gitlab: this repo flipped to GitHub-canonical in the CI
    # migration. The project spec still says gitlab.com/project-slug from
    # before that, and this is the corrected form Phase 2 should copy.
    github.com/project-slug: tnoff/backstage
    # No backstage.io/techdocs-ref: the techdocs backend is not installed, so
    # the annotation would advertise a Docs tab that cannot render.
spec:
  type: website
  # Was `john@example.com` from create-app. A Group rather than a User so the
  # field keeps meaning if a second person ever appears -- and so it does not
  # depend on an identity provider that does not exist.
  owner: group:default/admin
  lifecycle: production
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: admin
  description: >-
    Fleet administrators. The owner of record for everything in this catalog
    until there is a reason to split ownership more finely.
spec:
  type: team
  # Required by the Group schema even when empty. Empty is correct: `children`
  # holds nested GROUPS, not members, and there are no sub-groups.
  children: []
