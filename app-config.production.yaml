# Production config, layered over app-config.yaml.
#
# Access is internal-only, over the bastion port-forward that
# oci-bastion-keepalive holds (backstage/svc/backstage:7007). There is no
# Ingress, no Certificate and no public hostname -- see docs
# projects/service-catalog.md, "Runtime placement". The browser therefore talks
# to 127.0.0.1:7007, and because the app-backend plugin serves the frontend from
# the backend, app.baseUrl and backend.baseUrl are the same URL.

app:
  baseUrl: http://127.0.0.1:7007

backend:
  baseUrl: http://127.0.0.1:7007
  listen: ':7007'

  auth:
    # Accept unauthenticated requests to plugin routes.
    #
    # backend-defaults installs a credentials barrier ahead of every /api route
    # that requires user or service credentials. It lives in backend-defaults,
    # NOT in plugin-auth-backend, so it applies whether or not an auth plugin is
    # installed -- and this app has no SignInPage, so the frontend never obtains
    # a token to send. Every catalog call came back:
    #
    #   401 {"name":"AuthenticationError","message":"Missing credentials"}
    #
    # The frontend renders, the entity list is empty, and nothing in the UI says
    # why. Removing the auth plugins did not cause this and restoring them would
    # not fix it: a provider with no sign-in page still yields no token.
    #
    # `dangerously` is accurate about what it does -- it opens every /api route
    # to anything that can reach the port -- and that is the access model
    # already chosen deliberately. The only route to this port is a bastion
    # tunnel authenticated by an OCI identity and an SSH key; see docs
    # projects/service-catalog.md. Nothing is being widened here, it is being
    # made to work.
    #
    # Note it also drops authentication on plugin-to-plugin calls. This backend
    # runs app-backend and catalog, which make none.
    #
    # The alternative -- a SignInPage extension plus the guest provider with
    # dangerouslyAllowOutsideDevelopment -- reinstates two plugins and a second
    # dangerous flag to arrive at the same anonymous access. Revisit together
    # with a real identity provider, not before.
    dangerouslyDisableDefaultAuthPolicy: true

  # Same origin as the baseUrls above: the frontend is served by the backend, so
  # there is no separate dev-server origin to allow.
  cors:
    origin: http://127.0.0.1:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  database:
    client: pg
    # Keep every plugin in the `backstage` database, as separate SCHEMAS.
    #
    # Backstage's DEFAULT is one DATABASE per plugin -- backstage_plugin_app,
    # backstage_plugin_catalog, and so on, created at startup. That default
    # needs CREATEDB on the role and it breaks the backup: the CronJob in
    # docker-apps dumps DATABASE_NAME=backstage, which under the default would
    # be an empty shell while every byte of real data sat in databases the dump
    # never touched. A backup that silently captures nothing is the worst
    # possible failure here, because it only surfaces on restore.
    #
    # Schema mode fixes both at once: no CREATEDB grant, and one database that
    # pg_dump actually captures in full. It also makes the operator-side
    # ownership choice load-bearing rather than incidental -- creating a schema
    # requires owning the database, which `databases: {backstage:
    # backstage.backstage}` already arranges.
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # Required under pluginDivisionMode: schema, and easy to miss because the
      # scaffold's connection block does not have it.
      #
      # In the DEFAULT division mode Backstage computes a database name per
      # plugin (backstage_plugin_app, ...), so `database` is never consulted.
      # In schema mode it connects to ONE database -- and with no name given,
      # node-postgres falls back to the USERNAME. That produced:
      #
      #   database "backstage.backstage" does not exist
      #
      # which reads like a role problem and is actually a missing key.
      database: backstage
      # Encrypt, but do not verify the server certificate -- the node-postgres
      # equivalent of the sslmode=require that the discord backup CronJob uses.
      # Spilo presents a self-signed cert and only accepts `hostssl` for remote
      # pods, so without SSL the connection is refused outright and the pod
      # CrashLoops on startup.
      #
      # Set EXPLICITLY rather than via the PGSSLMODE env var the scaffold's
      # comment suggests. PGSSLMODE only takes effect through node-postgres'
      # environment fallback, and this config already passes explicit connection
      # options -- so whether the fallback still applies is a question about
      # library internals, and the failure mode if it does not is a CrashLoop.
      # Not worth betting on when one line settles it.
      ssl:
        rejectUnauthorized: false


# GitHub App used for catalog discovery. Contents + Metadata read across the
# fleet, nothing else; created by hand, credentials plumbed by terraform-admin
# -> terraform/apps -> the backstage-github-app-credentials Secret.
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID}
          # NOT a real credential, and deliberately so.
          #
          # GitHub App API auth is appId + privateKey -> JWT -> installation
          # token; a client secret belongs to the OAuth user flow, which this
          # App never enters. But readGithubIntegrationConfig reads clientSecret
          # with getString (not getOptionalString), so the KEY has to exist or
          # integration construction throws.
          #
          # The VALUE is never used: SingleInstanceGithubCredentialsProvider
          # builds `baseAuthConfig = {appId, privateKey}` and both createAppAuth
          # call sites take exactly that. So no client secret was generated on
          # the App at all -- a real one would be a live OAuth credential
          # in-cluster with no consumer and a rotation obligation to match.
          #
          # If a future @backstage/integration wires client credentials into the
          # app-auth path this breaks loudly at the first API call, and the fix
          # is to generate a real secret then.
          clientSecret: unused-see-comment-above
          # Mounted from the Secret by the Deployment. A file, not an env var:
          # a PEM is multi-line, and `$file` avoids depending on newlines
          # surviving YAML substitution.
          privateKey:
            $file: /etc/backstage/github-app/private-key.pem
          # Refuse to mint tokens for anyone else's installation, even if this
          # App somehow ends up installed elsewhere. Keys on the owner LOGIN --
          # there is no installation ID anywhere in this config because
          # @backstage/integration never reads one.
          allowedInstallationOwners: [tnoff]

# Overrides app-config.yaml, which ships `enabled: true`.
#
# With permissions ON, the frontend calls /api/permission/authorize and the
# backend must run plugin-permission-backend plus a policy module to answer.
# The scaffold's policy is allow-all, so the whole round trip exists to return
# "yes" to an anonymous caller -- two plugins and a network call to enforce
# nothing.
#
# Turning it off lets those two plugins go (see packages/backend/src/index.ts).
# @backstage/plugin-permission-react short-circuits when disabled, so no call
# is made and nothing 404s. Turn this back on in the same change that adds a
# real policy and a real identity provider.
permission:
  enabled: false

catalog:
  providers:
    github:
      tnoff:
        # Works on a PERSONAL account, which is not obvious: the config key is
        # `organization`, the function is getOrganizationRepositories, and the
        # sibling GithubOrgEntityProvider genuinely does require an org. But the
        # discovery query underneath is `repositoryOwner(login: $org)`, and
        # repositoryOwner is a GraphQL interface implemented by BOTH User and
        # Organization. Checked in the provider source before relying on it.
        #
        # (GithubOrgEntityProvider is a different story -- it queries
        # `organization(login:)`, which returns null for a user account. That is
        # why the admin Group and its members stay hand-written in
        # catalog-info.yaml rather than syncing from GitHub.)
        organization: tnoff
        catalogPath: /catalog-info.yaml
        # Emit a Location only for repos that ACTUALLY have the file.
        #
        # Defaults to false, which emits one for all ~28 repos. They are
        # `presence: optional` so nothing errors -- you just get a catalog full
        # of Locations pointing at files that do not exist, and no signal about
        # which repos are really onboarded.
        #
        # Free here: the GraphQL query already fetches the blob to read it, so
        # validating costs no extra API calls. That is not true of the REST
        # path, which is why the docs warn about this option in general.
        validateLocationsExist: true
        filters:
          # The fleet carries upstream forks (moviepy, opentelemetry-python-
          # contrib, terraform-provider-signalfx, MagicMirror). None should
          # become catalog entries, and none of them will grow a descriptor --
          # but excluding them by intent beats relying on that.
          allowForks: false
        # Archived repos are excluded by default (allowArchived: false), which
        # covers ci-base-images, cl-calculator and OpenStack-Portation.
        #
        # No webhook, so this poll is the only refresh path: the provider can
        # consume github.push / github.repository events, but that needs a
        # publicly reachable ingest URL and there is no Ingress. 3h is the
        # provider default and is fine for a catalog that changes on merges.
        schedule:
          frequency: { hours: 3 }
          timeout: { minutes: 15 }

  # Rules apply to DISCOVERED locations too, and the base config's list is
  # Component/System/API/Resource/Location -- no Group. Without Group here the
  # admin group is rejected entity by entity as each location is processed, the
  # catalog comes up with every Component owned by a ref that resolves to
  # nothing, and the only sign is a line in the logs.
  #
  # Listed in full rather than appended: config array merge REPLACES, so this
  # has to restate the base kinds it still wants.
  rules:
    - allow: [Component, System, API, Resource, Location, Group]

  # Empty, and NOT absent. app-config.yaml still carries the scaffold's example
  # locations (../../examples/entities.yaml and friends), and config arrays
  # replace rather than merge -- so when #12 deleted this block entirely those
  # examples came back to life in production, where the files are not in the
  # image:
  #
  #   warn  file /examples/org.yaml does not exist
  #   warn  file /examples/template/template.yaml does not exist
  #   warn  file /examples/entities.yaml does not exist
  #
  # once per refresh cycle, forever. They stay in the base config because they
  # are useful for `yarn start` locally, where discovery has no credentials.
  locations: []

  # This repo's own catalog-info.yaml is picked up by the discovery provider
  # above, exactly like every other repo's.
  #
  # It used to be loaded as a file location out of the image, and keeping both
  # would break: the two mechanisms emit the same entityRefs, and the catalog
  # rejects the second with "Detected conflicting entityRef
  # component:default/backstage already referenced by ...". One mechanism, not
  # two.
  #
  # The tradeoff is that the catalog is EMPTY if the App credential is broken,
  # rather than falling back to a floor of one Component and one Group. That is
  # the honest signal -- a portal that can only see itself is not serving its
  # purpose either, and catalog-backend-module-logs reports the reason. Reverting
  # is a `locations:` block and a Dockerfile COPY away.
