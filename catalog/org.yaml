# Org entities: who owns things in this catalog.
#
# Shipped in the image rather than fetched from a URL. The catalog has no
# GitHub integration configured (the token would be one more secret for a
# portal only reachable over a bastion port-forward), and these two entities
# change about never, so a file location is simpler and has no failure mode.
#
# `admin` is deliberately a Group rather than a literal user, even though there
# is exactly one operator today. Ownership recorded as `user:default/tnoff`
# would have to be rewritten across every catalog-info.yaml the day a second
# person appears, or the day the operator's identity changes; a group is a
# level of indirection that costs nothing now and is the difference between an
# edit and a migration later.
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: admin
  description: >-
    Fleet administrators. The owner of record for everything in this catalog
    until there is a reason to split ownership more finely.
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: tnoff
  description: Fleet operator.
spec:
  # No spec.profile.email on purpose: this repo is PUBLIC, and nothing needs
  # the address yet. Sign-in resolvers can match on the entity name, and an
  # email only becomes necessary if a provider is configured to resolve by it.
  memberOf: [admin]
