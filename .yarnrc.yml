nodeLinker: node-modules
npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - '@backstage/*'
  # Transitive dependency of Backstage itself, authored and published by a
  # Backstage core maintainer (rugvip / github.com/Rugvip/nunjitsu). Pinned
  # here only because npmMinimalAgeGate above quarantines releases younger
  # than 3d, and 0.6.0 shipped 2026-08-20. Preapproving one known package is
  # narrower than lowering the gate for everything.
  - 'nunjitsu'

yarnPath: .yarn/releases/yarn-4.13.0.cjs
